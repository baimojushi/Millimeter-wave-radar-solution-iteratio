; PlatformIO Project Configuration File
; ESP32 Radar Parser
;
; VSCode操作：
;   编译  → 底部状态栏点击 ✓ (Build)
;   上传  → 底部状态栏点击 → (Upload)
;   串口  → 底部状态栏点击 插头图标 (Serial Monitor)
;
; 两个编译目标：
;   esp32-wifi  → WiFi AP 版本（src/main_wifi.cpp）
;   esp32-bt    → 经典蓝牙 SPP 版本（src/main_bt.cpp）
;
; 上传特定版本：
;   pio run -e esp32-wifi -t upload
;   pio run -e esp32-bt   -t upload

[common]
platform = espressif32
board    = esp32dev
framework = arduino
upload_speed  = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; ---- WiFi AP 版本 ----
[env:esp32-wifi]
extends = common
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
; 只编译 WiFi 版本的 main 文件
build_src_filter = +<main_wifi.cpp>

; ---- 经典蓝牙 SPP 版本 ----
[env:esp32-bt]
extends = common
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_CLASSIC_BT_ENABLED=1
build_src_filter = +<main_bt.cpp>
