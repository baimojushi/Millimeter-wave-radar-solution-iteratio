; PlatformIO Project Configuration File
; ESP32-C3 Radar Parser with BLE
;
; VSCode使用方法:
; 1. 安装PlatformIO IDE扩展
; 2. 打开此文件夹
; 3. 点击底部状态栏的"√"编译，"→"上传

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; 串口配置
upload_speed = 921600
monitor_speed = 115200

; 编译选项
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; BLE库配置
lib_deps =
    ; ESP32 BLE库已包含在框架中

; 分区表（确保有足够空间存放BLE栈）
board_build.partitions = default.csv

; 监视器过滤器
monitor_filters = 
    esp32_exception_decoder
    time
