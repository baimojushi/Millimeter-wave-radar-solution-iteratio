; PlatformIO Project Configuration File
; ESP32-C3 Radar Parser - WiFi TCP Version
;
; VSCode操作：
;   编译  → 底部状态栏点击 ✓ (Build)
;   上传  → 底部状态栏点击 → (Upload)
;   串口  → 底部状态栏点击 插头图标 (Serial Monitor)

[env:esp32-c3]
platform = espressif32
board    = esp32-c3-devkitm-1
framework = arduino

upload_speed  = 921600
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_filters =
    esp32_exception_decoder
    time
